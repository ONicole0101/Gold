<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{report_title}}</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .container {
      width: 100%;
      margin: 0;
      padding: 16px;
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: clamp(20px, 2.4vw, 30px);
      line-height: 1.25;
    }

    .card {
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: clamp(8px, 1vw, 15px);
      overflow: hidden;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
      padding: 8px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
    }

    .tab-btn {
      border: 1px solid #30363d;
      border-radius: 999px;
      background: #21262d;
      color: #c9d1d9;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }

    .tab-btn:hover {
      background: #263041;
    }

    .tab-btn.active {
      background: #238636;
      border-color: #2ea043;
      color: #fff;
      font-weight: bold;
    }

    .tab-note {
      margin-left: auto;
      color: #8b949e;
      font-size: 12px;
      align-self: center;
    }

    .table-scroll {
      overflow: auto;
      max-height: min(70vh, 700px);
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: clamp(11px, 1vw, 13px);
    }

    thead th {
      position: sticky;
      top: 0;
      background: #1c2330;
      z-index: 200;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 2px 0 #30363d;
    }

    thead th:hover {
      background: #263041;
    }

    tbody td {
      background: #161b22;
      position: relative;
      z-index: 1;
    }

    tbody td:first-child {
      position: sticky;
      left: 0;
      background: #161b22;
      z-index: 150;
    }

    thead th:first-child {
      position: sticky;
      top: 0;
      left: 0;
      background: #1c2330;
      z-index: 250;
    }

    th,
    td {
      padding: clamp(6px, 0.8vw, 10px);
      border-bottom: 1px solid #30363d;
      border-right: 1px solid #30363d;
      white-space: nowrap;
      vertical-align: middle;
    }

    thead th,
    tbody td:first-child {
      background-clip: padding-box;
    }

    .table-lv1 {
      font-size: clamp(11px, 1vw, 13px);
      line-height: 1.25;
    }

    .table-lv2 {
      font-size: clamp(10px, 0.9vw, 11px);
      line-height: 1.2;
      color: #8b949e;
    }

    .table-lv3 {
      font-size: clamp(9px, 0.85vw, 10px);
      line-height: 1.2;
      color: #8b949e;
    }

    .cb-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .cb-issue-block {
      min-height: 42px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #30363d;
    }

    .cb-issue-block:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .cb-pressure-high {
      color: #f85149;
      font-weight: 700;
    }

    .cb-pressure-medium {
      color: #d29922;
      font-weight: 700;
    }

    .cb-pressure-low {
      color: #3fb950;
    }

    .up {
      color: #f85149;
    }

    .dn {
      color: #3fb950;
    }

    .closing-price {
      display: inline-block;
      min-width: 54px;
      padding: 2px 5px;
      border: 1px solid transparent;
      border-radius: 4px;
    }

    .closing-price.up {
      color: #f85149;
    }

    .closing-price.dn {
      color: #3fb950;
    }

    .closing-price.price-move-up {
      border-color: #f85149;
    }

    .closing-price.price-move-down {
      border-color: #3fb950;
    }

    .closing-price.price-limit-up {
      border-color: #f85149;
      background: #f8514938;
      color: #ff7b72;
      font-weight: 700;
    }

    .closing-price.price-limit-down {
      border-color: #3fb950;
      background: #3fb95038;
      color: #56d364;
      font-weight: 700;
    }

    .price-lh-line {
      display: grid;
      grid-template-columns: 40px max-content max-content;
      justify-content: center;
      column-gap: 6px;
      align-items: center;
      line-height: 1.35;
      color: #8b949e;
    }

    .price-lh-date {
      text-align: right;
    }

    .sig {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.4;
    }

    .sig.up {
      background: #3fb95022;
      color: #3fb950;
    }

    .sig.dn {
      background: #f8514922;
      color: #f85149;
    }

    .sig.watch {
      background: #d2992222;
      color: #d29922;
    }

    .signal-cell {
      min-width: 180px;
      white-space: normal;
      line-height: 1.4;
    }


    .text-summary-cell {
      width: clamp(220px, 18vw, 420px);
      min-width: clamp(220px, 18vw, 420px);
      max-width: clamp(280px, 24vw, 520px);
      white-space: normal;
      line-height: 1.55;
      color: #c9d1d9;
      vertical-align: top;
    }

    .industry-summary-cell {
      width: clamp(220px, 18vw, 420px);
      min-width: clamp(220px, 18vw, 420px);
      max-width: clamp(280px, 23vw, 500px);
    }

    .news-summary-cell {
      width: clamp(260px, 24vw, 560px);
      min-width: clamp(260px, 24vw, 560px);
      max-width: clamp(320px, 30vw, 680px);
    }

    .summary-text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 6;
      overflow: hidden;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .text-summary-cell:hover .summary-text {
      -webkit-line-clamp: unset;
      overflow: visible;
    }

    .signal-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .box {
      padding: clamp(8px, 1.5vw, 12px);
      border-radius: 8px;
      text-align: center;
      min-width: 0;
      font-size: clamp(12px, 1vw, 14px);
    }

    .buy {
      background: #3fb95022;
    }

    .sell {
      background: #f8514922;
    }

    .watch {
      background: #d2992222;
    }

    .hold {
      background: #8b949e22;
    }

    .metric {
      text-align: center;
      line-height: 1.2;
    }

    .metric-main {
      font-size: clamp(11px, 1vw, 12px);
      font-weight: normal;
    }

    .metric-sub {
      font-size: clamp(10px, 0.9vw, 11px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .metric-2line {
      line-height: 1.4;
    }

    .metric-note {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      color: #8b949e;
      white-space: normal;
    }

    .text-red {
      color: #ff4d4f;
    }

    .text-green {
      color: #00b050;
    }

    .mobile-list {
      display: none;
    }

    .stock-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .stock-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .stock-title {
      font-size: 15px;
      font-weight: bold;
    }

    .stock-price {
      font-size: 18px;
      font-weight: bold;
    }

    .stock-change {
      font-size: 13px;
    }

    .stock-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 10px;
      font-size: 12px;
    }

    .stock-item {
      min-width: 0;
    }

    .stock-label {
      color: #8b949e;
      font-size: 11px;
      margin-bottom: 2px;
    }

    .stock-value {
      word-break: break-word;
    }

    .stock-signal {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #30363d;
      font-size: 12px;
      line-height: 1.5;
    }

    .filter-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 8px;
      margin: 10px 0 14px;
      padding: 10px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
    }

    .filter-title-row {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px 12px;
      margin-bottom: 2px;
    }

    .filter-title {
      flex: 1 1 auto;
      color: #8b949e;
      font-size: 12px;
    }

    .code-filter-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .top-right-filters {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 8px;
    }

    .code-filter-item label {
      color: #c9d1d9;
      white-space: nowrap;
    }

    .code-filter-item input {
      width: 118px;
      height: 26px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #e6edf3;
      padding: 2px 6px;
      font-size: 12px;
    }

    .filter-item {
      display: grid;
      grid-template-columns: auto 40px 66px;
      align-items: center;
      gap: 3px;
      font-size: 12px;
    }

    .filter-item.filter-item-direction {
      grid-template-columns: auto 66px;
    }

    .filter-row {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 6px;
    }

    .filter-item label {
      color: #c9d1d9;
      white-space: nowrap;
    }

    .filter-item select,
    .filter-item input {
      width: 100%;
      box-sizing: border-box;
      height: 26px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #e6edf3;
      padding: 2px 4px;
      font-size: 12px;
    }

    .category-dropdown {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .category-dropdown label {
      color: #c9d1d9;
      white-space: nowrap;
    }

    .category-toggle-btn {
      min-width: 146px;
      height: 26px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #e6edf3;
      padding: 2px 8px;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }

    .category-popover {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: min(300px, calc(100vw - 28px));
      padding: 8px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
      box-shadow: 0 12px 28px #0009;
      z-index: 980;
    }

    .category-search-input {
      width: 100%;
      height: 28px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #e6edf3;
      padding: 4px 8px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .category-options {
      max-height: 220px;
      overflow: auto;
      display: grid;
      gap: 4px;
      padding-right: 2px;
    }

    .category-quick-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .category-quick-btn {
      flex: 1;
      height: 26px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      cursor: pointer;
    }

    .category-quick-btn:hover {
      background: #263041;
    }

    .category-option {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 12px;
      color: #c9d1d9;
      cursor: pointer;
      user-select: none;
    }

    .category-option:hover {
      background: #21262d;
    }

    .category-empty {
      margin-top: 4px;
      color: #8b949e;
      font-size: 12px;
    }

    .filter-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .filter-actions button {
      height: 28px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #238636;
      color: #fff;
      padding: 2px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .filter-actions button.secondary {
      background: #21262d;
    }

    .filter-count {
      color: #8b949e;
      font-size: 12px;
      white-space: nowrap;
    }

    .col-volume {
      width: 76px;
      min-width: 76px;
      max-width: 82px;
      padding-left: 4px;
      padding-right: 4px;
    }

    .col-cb-id {
      width: 92px;
      min-width: 92px;
    }

    .col-cb-market {
      width: 132px;
      min-width: 132px;
    }

    .col-cb-conversion {
      width: 126px;
      min-width: 126px;
    }

    .col-cb-wide {
      width: 156px;
      min-width: 156px;
    }

    .col-cb-potential {
      width: 132px;
      min-width: 132px;
    }

    .col-cb-pressure-days {
      width: 132px;
      min-width: 132px;
    }

    .col-cb-period {
      width: 110px;
      min-width: 110px;
    }

    .col-cb-rank {
      width: 124px;
      min-width: 124px;
    }


    thead th[data-tooltip]::before {
      content: "ⓘ";
      display: inline-block;
      margin-left: 4px;
      color: #58a6ff;
      font-size: 11px;
      vertical-align: top;
    }

    thead th[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      width: min(320px, 70vw);
      padding: 8px 10px;
      border: 1px solid #58a6ff66;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      box-shadow: 0 8px 24px #0008;
      white-space: normal;
      line-height: 1.45;
      text-align: left;
      font-size: 12px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 900;
    }

    thead th[data-tooltip]:hover::after,
    thead th[data-tooltip]:focus::after {
      opacity: 1;
      visibility: visible;
    }

    .sr-price-cell .table-lv2 {
      color: #8b949e;
    }

    .sr-price-cell {
      cursor: help;
    }

    .disposition-period {
      margin-top: 2px;
      line-height: 1.3;
      white-space: normal;
    }

    .disposition-period div {
      white-space: nowrap;
    }

    /* ── 指數固定列 ─────────────────────────────────────────── */
    .index-row td {
      background: #1a2840 !important;
      font-weight: 600;
    }

    .index-row td:first-child {
      background: #1a2840 !important;
    }

    .index-row td .table-lv2 {
      color: #7d9ec0;
    }

    .index-label {
      display: inline-block;
      margin-left: 4px;
      padding: 1px 5px;
      border-radius: 4px;
      background: #0d4a8a44;
      border: 1px solid #2560a8;
      color: #7eb8f7;
      font-size: 10px;
      vertical-align: middle;
    }

    .index-toggle-btn {
      border: 1px solid #2560a8;
      border-radius: 999px;
      background: #0d4a8a44;
      color: #7eb8f7;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }

    .index-toggle-btn.active {
      background: #1a4f8a;
      border-color: #4a90e2;
      color: #fff;
      font-weight: bold;
    }

    @media (max-width: 1024px) {
      .container {
        padding: 12px;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      th,
      td {
        padding: 6px;
        font-size: 11px;
      }

      .col-lg {
        display: none;
      }

      .table-scroll {
        max-height: 65vh;
      }

      .tab-note {
        width: 100%;
        margin-left: 0;
      }

      .top-right-filters {
        width: 100%;
        margin-left: 0;
        justify-content: flex-start;
      }

      .text-summary-cell {
        width: clamp(200px, 32vw, 380px);
        min-width: clamp(200px, 32vw, 380px);
        max-width: clamp(240px, 42vw, 460px);
      }

      .news-summary-cell {
        width: clamp(240px, 42vw, 520px);
        min-width: clamp(240px, 42vw, 520px);
        max-width: clamp(280px, 52vw, 600px);
      }
    }

    @media (max-width: 640px) {
      .container {
        padding: 8px;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .tabs {
        gap: 6px;
        padding: 6px;
      }

      .tab-btn {
        padding: 7px 10px;
        font-size: 12px;
      }

      .card {
        padding: 0;
        border: none;
        background: transparent;
        overflow: visible;
      }

      .table-scroll {
        display: none;
      }

      .mobile-list {
        display: block;
      }

      .stock-grid {
        grid-template-columns: 1fr;
      }

      .stock-item.summary-mobile-item {
        grid-column: 1 / -1;
      }

      .stock-item.summary-mobile-item .stock-value {
        line-height: 1.55;
        white-space: normal;
        word-break: break-word;
        overflow-wrap: anywhere;
      }

      .code-filter-item,
      .category-dropdown {
        width: 100%;
      }

      .code-filter-item input,
      .category-toggle-btn {
        flex: 1;
        min-width: 0;
      }

      .category-popover {
        left: 0;
        right: auto;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <p>產生時間：{{ generated_time }}</p>

    <div class="tabs" id="tabs">
      <button type="button" class="tab-btn active" data-tab="overview">總覽</button>
      <button type="button" class="tab-btn" data-tab="technical">技術面</button>
      <button type="button" class="tab-btn" data-tab="chip">籌碼面</button>
      <button type="button" class="tab-btn" data-tab="fundamental">基本面</button>
      <button type="button" class="tab-btn" data-tab="cb">CB</button>
      <button type="button" class="index-toggle-btn active" id="indexToggleBtn" title="切換顯示加權/櫃買指數固定列">📊 顯示指數</button>
      <span class="tab-note" id="tabNote">總覽：價格、漲跌、量、KD、布林</span>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-title-row">
        <div class="filter-title">篩選條件：可多條件累積篩選；輸入即時更新，也可按「套用」。</div>
        <div class="top-right-filters">
          <div class="code-filter-item">
            <label for="stockCodeFilter">股票代號</label>
            <input id="stockCodeFilter" type="text" inputmode="numeric" placeholder="例如 2330">
          </div>
          <div class="category-dropdown" id="customCategoryDropdown">
            <label for="customCategoryToggle">自選分類</label>
            <button type="button" class="category-toggle-btn" id="customCategoryToggle"
              aria-expanded="false">全部分類</button>
            <div class="category-popover" id="customCategoryPopover" hidden>
              <input id="customCategorySearch" class="category-search-input" type="text" placeholder="搜尋分類...">
              <div class="category-quick-actions">
                <button type="button" class="category-quick-btn" id="customCategorySelectAllBtn">全選</button>
                <button type="button" class="category-quick-btn" id="customCategoryClearBtn">清除分類</button>
              </div>
              <div class="category-options" id="customCategoryOptions">
                {% for category in custom_category_options | default([]) %}
                <label class="category-option" data-category="{{ category | e }}">
                  <input type="checkbox" class="custom-category-checkbox" value="{{ category | e }}">
                  <span>{{ category | e }}</span>
                </label>
                {% endfor %}
              </div>
              <div class="category-empty" id="customCategoryEmpty" hidden>查無分類</div>
            </div>
          </div>
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-item"><label>價格</label><select data-filter-op="price">
            <option value=">">&gt;</option>
            <option value="<">&lt;</option>
          </select><input data-filter-key="price" type="number" step="0.01" placeholder="數值"></div>
        <div class="filter-item"><label>漲跌%</label><select data-filter-op="chgPct">
            <option value=">">&gt;</option>
            <option value="<">&lt;</option>
          </select><input data-filter-key="chgPct" type="number" step="0.01" placeholder="數值"></div>

          { key: "cb_pressure_days", label: "壓力天數 T趨勢", cls: "col-cb-pressure-days", tooltip: "壓力天數＝潛在張數 ÷ 近20日平均成交量。上升紅、下降綠。若近20日量缺漏，會以當日量替代並標示；此為極端上限估算。" },
          { key: "cb_period", label: "轉換迄日<br><small>剩餘天數</small>", cls: "col-cb-period" },
          { key: "cb_pressure_rank", label: "壓力關注<br><small>T/T-1/T-2</small>", cls: "col-cb-rank", tooltip: "高關注：轉換已具經濟性或進入提前贖回期，且潛在供給約達5個平均成交日以上；中關注：股價已高於轉換價、距損平10%內或提前贖回中；其餘為低關注。總趨勢由溢價、距損平、壓力天數與分類變化投票，不重複計入高度相關的價內程度與轉換價值。" }
        ]
      },
    };

    function isNil(v) {
      return v === null || v === undefined || (typeof v === "number" && Number.isNaN(v));
    }

    function fmt(v, suffix = "") {
      if (v === null || v === undefined || v === "" || Number.isNaN(v)) return "-";
      const num = Number(v);
      if (num === 0) return "0" + suffix;
      const isInteger = Number.isInteger(num);
      const formatted = isInteger
        ? num.toLocaleString("en-US")
        : num.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      return formatted + suffix;
    }

    function fmtTrend(v) {
      if (v >= 1) return "↑↑";
      if (v > 0) return "↑";
      if (v <= -1) return "↓↓";
      if (v < 0) return "↓";
      return "→";
    }

    function trendClass(v) {
      if (v >= 1) return "up strong";
      if (v > 0) return "up";
      if (v <= -1) return "dn strong";
      if (v < 0) return "dn";
      return "";
    }

    function renderMetric3(value, m, q, y, suffix = "") {
      const renderLine = (label, v) => {
        if (isNil(v)) {
          return `<div>${label} -</div>`;
        }
        return `
      <div class="${trendClass(v)}">
        ${label} ${fmtTrend(v)} ${fmt(v, "%")}
      </div>
    `;
      };
      return `
  <div class="metric">
    <div class="table-lv1">${fmt(value, suffix)}</div>
    <div class="metric-sub">
      ${renderLine("M", m)}
      ${renderLine("Q", q)}
      ${renderLine("Y", y)}
    </div>
  </div>`;
    }

    function renderRangeMetric(current, low, high, suffix = "", cls = "", footer = "") {
      return `
      <div class="metric metric-2line">
        <div class="table-lv1 ${cls}">${fmt(current, suffix)}</div>
        <div class="table-lv2">${fmt(low, suffix)}</div>
        <div class="table-lv2">${fmt(high, suffix)}</div>
        ${footer ? `<div class="table-lv2">${footer}</div>` : ""}
      </div>`;
    }

    function closingPriceClass(chgPct) {
      const change = Number(chgPct);
      if (!Number.isFinite(change) || change === 0) return "";
      const direction = change > 0 ? "up" : "dn";
      const magnitude = Math.abs(change);
      if (magnitude > 9) return `${direction} price-limit-${change > 0 ? "up" : "down"}`;
      if (magnitude > 5) return `${direction} price-move-${change > 0 ? "up" : "down"}`;
      return direction;
    }

    function renderPriceRangeMetric(current, low, high, chgPct) {
      const cur = Number(current);
      const lowNum = Number(low);
      const highNum = Number(high);
      const hasCur = !isNil(current) && Number.isFinite(cur) && cur !== 0;
      const highDist = hasCur && !isNil(high) && Number.isFinite(highNum) ? ((highNum - cur) / cur) * 100 : null;
      const lowDist = hasCur && !isNil(low) && Number.isFinite(lowNum) ? ((lowNum - cur) / cur) * 100 : null;
      const lowDistText = isNil(lowDist) ? "" : ` <span class="table-lv2">${fmt(lowDist, "%")}</span>`;
      const highDistText = isNil(highDist) ? "" : ` <span class="table-lv2">${signedFmt(highDist, "%")}</span>`;
      return `
      <div class="metric metric-2line">
        <div class="table-lv1"><span class="closing-price ${closingPriceClass(chgPct)}">${fmt(current)}</span></div>
        <div class="table-lv2">${fmt(low)}${lowDistText}</div>
        <div class="table-lv2">${fmt(high)}${highDistText}</div>
      </div>`;
    }

    function renderPerRangeMetric(current, low, high, ttm) {
      const cur = Number(current);
      const lowNum = Number(low);
      const highNum = Number(high);
      const hasCur = !isNil(current) && Number.isFinite(cur) && cur !== 0;
      const lowDist = hasCur && !isNil(low) && Number.isFinite(lowNum) ? ((lowNum - cur) / cur) * 100 : null;
      const highDist = hasCur && !isNil(high) && Number.isFinite(highNum) ? ((highNum - cur) / cur) * 100 : null;
      const lowDistText = isNil(lowDist) ? "" : ` <span class="table-lv2">${signedFmt(lowDist, "%")}</span>`;
      const highDistText = isNil(highDist) ? "" : ` <span class="table-lv2">${signedFmt(highDist, "%")}</span>`;
      return `
      <div class="metric metric-2line">
        <div class="table-lv2">TTM ${fmt(ttm)}</div>
        <div class="table-lv1">${fmt(current)}</div>
        <div class="table-lv2">${fmt(low)}${lowDistText}</div>
        <div class="table-lv2">${fmt(high)}${highDistText}</div>
      </div>`;
    }

    function renderBBBlock(s) {
      return `
      <div class="metric metric-2line">
        <div class="table-lv1 ${trendClass(s.bb_score)}">${fmtTrend(s.bb_score)}</div>
        <div class="table-lv2">${fmt(s.bb_pct, "%")}</div>
        <div class="table-lv2">${fmt(s.bb_lower)}</div>
        <div class="table-lv2">${fmt(s.bb_upper)}</div>
      </div>`;
    }

    function supportResistanceTooltip(type) {
      if (type === "resistance") {
        return "壓力點距離%＝(壓力點價格 - 目前收盤價) ÷ 目前收盤價 × 100。數值越小代表越接近上方壓力。";
      }
      return "支撐點距離%＝(目前收盤價 - 支撐點價格) ÷ 目前收盤價 × 100。數值越小代表越接近下方支撐。";
    }

    function renderChangePctBlock(s) {
      const priceChange = isNil(s.chg) ? null : Number(s.chg);
      const priceAmplitude = isNil(s.chgamp) ? null : Number(s.chgamp);
      return `
        <div class="table-lv1 ${chgClass(s)}">${chgSign(s)}${fmt(s.chgPct, "%")}</div>
        <div class="table-lv2 ${distClass(priceChange)}">${isNil(priceChange) ? "-" : `${priceChange > 0 ? "+" : ""}${fmt(priceChange)}`}</div>
        <div class="table-lv2">幅${fmt(s.amp, "%")}</div>
        <div class="table-lv2">幅${fmt(priceAmplitude)}</div>`;
    }

    function distClass(val) {
      if (isNil(val)) return "";
      if (Number(val) > 0) return "up";
      if (Number(val) < 0) return "dn";
      return "";
    }

    function fmtMonthDay(dateText) {
      if (isNil(dateText) || dateText === "") return "";
      const parts = String(dateText).slice(0, 10).split("-");
      if (parts.length >= 3) return `${parts[1]}/${parts[2]}`;
      return String(dateText);
    }


    function chipDateMMDD(dateText, fallback = "") {
      const value = fmtMonthDay(dateText);
      return value ? value.replace("/", "") : fallback;
    }

    function renderSupportResistanceLevel(s, type, suffix) {
      const isResistance = type === "resistance";
      const price = isResistance ? s[`resistance_price${suffix}`] : s[`support_price${suffix}`];
      const distance = isResistance ? s[`resistance_distance_pct${suffix}`] : s[`support_distance_pct${suffix}`];
      const dateText = isResistance ? s[`resistance_date${suffix}`] : s[`support_date${suffix}`];
      const dateLabel = chipDateMMDD(dateText);
      const dateLine = dateLabel || "-";
      const priceLine = isNil(price) ? "-" : fmt(price);
      const distanceText = isNil(distance) ? "-" : `${isResistance ? "+" : "-"}${fmt(distance, "%")}`;
      return `
        <div class="table-lv2">${dateLine}</div>
        <div><span class="table-lv2 ${isResistance ? "text-red" : "text-green"}">${priceLine}</span> <span class="table-lv2">${distanceText}</span></div>`;
    }

    function renderSupportResistanceBlock(s, type) {
      return `<div class="stock-value">${renderSupportResistanceLevel(s, type, "")}<div style="margin-top:3px">${renderSupportResistanceLevel(s, type, "2")}</div></div>`;
    }

    function chipValueClass(current, previous) {
      if (isNil(current) || isNil(previous)) return "";
      const cur = Number(current);
      const prev = Number(previous);
      if (!Number.isFinite(cur) || !Number.isFinite(prev)) return "";
      if (cur > prev) return "up";
      if (cur < prev) return "dn";
      return "";
    }

    function pickFirst(...values) {
      for (const value of values) {
        if (!isNil(value) && value !== "") return value;
      }
      return null;
    }

    function chipLine(dateText, value, previousValue, suffix = "", unit = "", small = false, fallbackLabel = "") {
      const colorCls = previousValue === undefined ? "" : chipValueClass(value, previousValue);
      const label = chipDateMMDD(dateText, fallbackLabel);
      const displayValue = isNil(value) ? "-" : `${fmt(value, suffix)}${unit}`;
      return `<div class="table-lv2 ${colorCls}">${label ? `${label}：` : ""}${displayValue}</div>`;
    }

    function dayLabel(idx) {
      if (idx === 0) return "T";
      if (idx === 1) return "T-1";
      if (idx === 2) return "T-2";
      return "";
    }

    function dayDateMMDD(s, idx, prefix = "date") {
      const value = pickFirst(
        s[`${prefix}_date_t${idx}`],
        s[`date_t${idx}`],
        s[`price_date_t${idx}`],
        s[`kd_date_t${idx}`],
        s[`chip_date_t${idx}`],
        s[`date${idx}`]
      );
      return chipDateMMDD(value, dayLabel(idx));
    }

    function dayDateLabel(s, idx, prefix = "date") {
      const value = pickFirst(
        s[`${prefix}_date_t${idx}`],
        s[`date_t${idx}`],
        s[`price_date_t${idx}`],
        s[`kd_date_t${idx}`],
        s[`chip_date_t${idx}`],
        s[`date${idx}`]
      );
      return chipDateMMDD(value, "");
    }

    function kdValue(s, idx) {
      if (idx === 0) return pickFirst(s.k_t0, s.kd_k_t0, s.k);
      if (idx === 1) return pickFirst(s.k_t1, s.kd_k_t1, s.prev_k, s.k_prev, s.k_t_1, s.K_t1, s.k1);
      if (idx === 2) return pickFirst(s.k_t2, s.kd_k_t2, s.prev2_k, s.k_prev2, s.k_t_2, s.K_t2, s.k2);
      if (idx === 3) return pickFirst(s.k_t3, s.kd_k_t3, s.prev3_k, s.k_prev3, s.k_t_3, s.K_t3, s.k3);
      return null;
    }

    function dValue(s, idx) {
      if (idx === 0) return pickFirst(s.d_t0, s.kd_d_t0, s.d);
      if (idx === 1) return pickFirst(s.d_t1, s.kd_d_t1, s.prev_d, s.d_prev, s.d_t_1, s.D_t1, s.d1);
      if (idx === 2) return pickFirst(s.d_t2, s.kd_d_t2, s.prev2_d, s.d_prev2, s.d_t_2, s.D_t2, s.d2);
      if (idx === 3) return pickFirst(s.d_t3, s.kd_d_t3, s.prev3_d, s.d_prev3, s.d_t_3, s.D_t3, s.d3);
      return null;
    }

    function kdLine(s, idx) {
      const kValue = kdValue(s, idx);
      const dVal = dValue(s, idx);
      if (isNil(kValue) && isNil(dVal)) return "";
      const previousK = kdValue(s, idx + 1);
      const label = dayDateLabel(s, idx, "kd");
      const colorCls = isNil(previousK) ? "" : chipValueClass(kValue, previousK);
      const dPart = isNil(dVal) ? "" : ` / D ${fmt(dVal)}`;
      return `<div class="table-lv2 ${colorCls}">${label ? `${label}：` : ""}K ${fmt(kValue)}${dPart}</div>`;
    }

    function kdDayScore(s) {
      const k0 = kdValue(s, 0);
      const k1 = kdValue(s, 1);
      if (isNil(k0) || isNil(k1)) return 0;
      const cur = Number(k0);
      const prev = Number(k1);
      if (!Number.isFinite(cur) || !Number.isFinite(prev)) return 0;
      if (cur > prev) return 0.5;
      if (cur < prev) return -0.5;
      return 0;
    }

    function renderKDContent(s) {
      const score = kdDayScore(s);
      return `
        <div class="table-lv1 ${trendClass(score)}">${fmtTrend(score)}</div>
        ${kdLine(s, 0)}
        ${kdLine(s, 1)}
        ${kdLine(s, 2)}`;
    }

    function renderKDCell(s) {
      return `<td>${renderKDContent(s)}</td>`;
    }

    function renderKDBlock(s) {
      return `<div class="stock-value">${renderKDContent(s)}</div>`;
    }

    function dayMetricValue(s, key, idx) {
      if (idx === 0) return pickFirst(s[`${key}_t0`], s[key]);
      if (idx === 1 && (key === "bias5" || key === "bias20" || key === "bias60")) {
        const explicit = pickFirst(s[`${key}_t1`]);
        if (!isNil(explicit)) return explicit;

        const period = key === "bias5" ? 5 : key === "bias20" ? 20 : 60;
        const prevMa = pickFirst(s[`prev_ma${period}`], s[`ma${period}_t1`]);
        let prevClose = pickFirst(s.close_t1, s.prev_close);

        if (isNil(prevClose)) {
          const close = Number(s.price);
          const chg = Number(s.chg);
          if (Number.isFinite(close) && Number.isFinite(chg)) {
            prevClose = close - chg;
          }
        }

        const maNum = Number(prevMa);
        const closeNum = Number(prevClose);
        if (Number.isFinite(maNum) && maNum !== 0 && Number.isFinite(closeNum)) {
          return Number((((closeNum - maNum) / maNum) * 100).toFixed(2));
        }
      }
      if (idx === 1) return pickFirst(s[`${key}_t1`]);
      if (idx === 2) return pickFirst(s[`${key}_t2`]);
      return null;
    }

    function dayMetricLine(s, key, idx, suffix = "") {
      const value = dayMetricValue(s, key, idx);
      if (isNil(value)) return "";
      const previous = dayMetricValue(s, key, idx + 1);
      const colorCls = isNil(previous) ? "" : chipValueClass(value, previous);
      const label = dayDateLabel(s, idx, "date");
      return `<div class="table-lv2 ${colorCls}">${label ? `${label}：` : ""}${fmt(value, suffix)}</div>`;
    }

    function dayMetricScore(s, key) {
      const cur = dayMetricValue(s, key, 0);
      const prev = dayMetricValue(s, key, 1);
      if (isNil(cur) || isNil(prev)) return 0;
      const c = Number(cur);
      const p = Number(prev);
      if (!Number.isFinite(c) || !Number.isFinite(p)) return 0;
      if (c > p) return 0.5;
      if (c < p) return -0.5;
      return 0;
    }

    function metricDirection(current, previous) {
      if (isNil(current) || isNil(previous)) return "";
      const cur = Number(current);
      const prev = Number(previous);
      if (!Number.isFinite(cur) || !Number.isFinite(prev)) return "";
      if (cur > prev) return "up";
      if (cur < prev) return "down";
      return "flat";
    }

    function kdDirection(s) {
      return metricDirection(kdValue(s, 0), kdValue(s, 1));
    }

    function bbDirection(s) {
      return metricDirection(
        dayMetricValue(s, "bb_pct", 0),
        dayMetricValue(s, "bb_pct", 1)
      );
    }

    function renderDayPairContent(s, key, suffix = "") {
      const score = dayMetricScore(s, key);
      return `
        <div class="table-lv1 ${trendClass(score)}">${fmtTrend(score)}</div>
        ${dayMetricLine(s, key, 0, suffix)}
        ${dayMetricLine(s, key, 1, suffix)}`;
    }

    function renderThreeDayMetricContent(s, key, suffix = "") {
      const cur = dayMetricValue(s, key, 0);
      const prev = dayMetricValue(s, key, 1);
      const score = isNil(cur) || isNil(prev) ? 0 : Number(cur) > Number(prev) ? 0.5 : Number(cur) < Number(prev) ? -0.5 : 0;
      const line = (idx) => {
        const value = dayMetricValue(s, key, idx);
        if (isNil(value)) return "";
        const previous = idx < 2 ? dayMetricValue(s, key, idx + 1) : null;
        const cls = isNil(previous) ? "" : chipValueClass(value, previous);
        const label = dayDateLabel(s, idx);
        const arrow = isNil(previous) ? "" : Number(value) > Number(previous) ? " ↑" : Number(value) < Number(previous) ? " ↓" : " →";
        return `<div class="table-lv2 ${cls}">${label ? `${label}：` : ""}${fmt(value, suffix)}${arrow}</div>`;
      };
      return `
        <div class="table-lv1 ${trendClass(score)}">${fmtTrend(score)}</div>
        ${line(0)}
        ${line(1)}
        ${line(2)}`;
    }

    function renderBBTechnicalContent(s) {
      const low = pickFirst(s.bb_pct_90d_low, s.bb_pct_low, s.bb_lower);
      const high = pickFirst(s.bb_pct_90d_high, s.bb_pct_high, s.bb_upper);
      return `
        ${renderThreeDayMetricContent(s, "bb_pct", "%")}
        <div class="table-lv3">${fmt(low)} / ${fmt(high)}</div>`;
    }

    function renderMacdTechnicalContent(s) {
      return renderThreeDayMetricContent(s, "macd_hist");
    }

    function renderRsiTechnicalContent(s) {
      return renderThreeDayMetricContent(s, "rsi", "%");
    }

    function renderBiasTechnicalContent(s, key) {
      const low = pickFirst(s[`${key}_min`], s[`${key}_60d_low`]);
      const high = pickFirst(s[`${key}_max`], s[`${key}_60d_high`]);
      return `
        ${renderDayPairContent(s, key, "%")}
        <div class="table-lv3">${fmt(low, "%")} / ${fmt(high, "%")}</div>`;
    }

    function priceLHValue(s, idx, kind) {
      const field = kind === "low" ? "min" : "max";
      const legacy = kind === "low" ? "low" : "high";
      if (idx === 0) {
        return pickFirst(s[`price_${field}_t0`], s[`price_${legacy}_t0`], kind === "low" ? s.price_min : s.price_max);
      }
      if (idx === 1) {
        return pickFirst(s[`price_${field}_t1`], s[`price_${legacy}_t1`], s[`prev_price_${field}`], s[`prev_${legacy}`]);
      }
      if (idx === 2) {
        return pickFirst(s[`price_${field}_t2`], s[`price_${legacy}_t2`], s[`prev2_price_${field}`], s[`prev2_${legacy}`]);
      }
      if (idx === 3) {
        return pickFirst(s[`price_${field}_t3`], s[`price_${legacy}_t3`], s[`prev3_price_${field}`], s[`prev3_${legacy}`]);
      }
      return null;
    }

    function priceLHTrendScore(s) {
      const low0 = priceLHValue(s, 0, "low");
      const high0 = priceLHValue(s, 0, "high");
      const low1 = priceLHValue(s, 1, "low");
      const high1 = priceLHValue(s, 1, "high");
      const low2 = priceLHValue(s, 2, "low");
      const high2 = priceLHValue(s, 2, "high");
      if ([low0, high0, low1, high1, low2, high2].some(isNil)) return null;
      const higherHighs = Number(high0) > Number(high1) && Number(high1) > Number(high2);
      const higherLows = Number(low0) > Number(low1) && Number(low1) > Number(low2);
      const lowerHighs = Number(high0) < Number(high1) && Number(high1) < Number(high2);
      const lowerLows = Number(low0) < Number(low1) && Number(low1) < Number(low2);
      if (higherHighs && higherLows) return 1;
      if (lowerHighs && lowerLows) return -1;
      return 0;
    }

    function priceLHTrendLabel(score) {
      if (isNil(score)) return "-";
      if (score > 0) return "高高";
      if (score < 0) return "低低";
      return "盤整";
    }

    function renderPriceLHTrendSummary(score) {
      return `
        <div class="table-lv2 price-lh-line">
          <span class="price-lh-date ${trendClass(score)}">${priceLHTrendLabel(score)}</span>
          <span></span>
          <span></span>
        </div>`;
    }

    function renderPriceLHLine(s, idx, previousIdx) {
      const low = priceLHValue(s, idx, "low");
      const high = priceLHValue(s, idx, "high");
      const previousLow = previousIdx === undefined ? undefined : priceLHValue(s, previousIdx, "low");
      const previousHigh = previousIdx === undefined ? undefined : priceLHValue(s, previousIdx, "high");
      const lowCls = previousIdx === undefined ? "" : chipValueClass(low, previousLow);
      const highCls = previousIdx === undefined ? "" : chipValueClass(high, previousHigh);
      const label = dayDateMMDD(s, idx, "price");
      return `
        <div class="table-lv2 price-lh-line">
          <span class="price-lh-date">${escapeHtml(label)}：</span>
          <span class="${lowCls}"> ${fmt(low)}</span>
          <span class="${highCls}">/ ${fmt(high)}</span>
        </div>`;
    }

    function renderPriceLHTrendCell(s) {
      const score = priceLHTrendScore(s);
      return `
        <td>
          ${renderPriceLHTrendSummary(score)}
          ${renderPriceLHLine(s, 0, 1)}
          ${renderPriceLHLine(s, 1, 2)}
          ${renderPriceLHLine(s, 2, 3)}
        </td>`;
    }

    function renderPriceLHTrendBlock(s) {
      const score = priceLHTrendScore(s);
      return `<div class="stock-value">
        ${renderPriceLHTrendSummary(score)}
        ${renderPriceLHLine(s, 0, 1)}
        ${renderPriceLHLine(s, 1, 2)}
        ${renderPriceLHLine(s, 2, 3)}
      </div>`;
    }

    function renderChipConcentrationCell(s) {
      return `
        <td>
          <div class="chip-detail">
            <div class="table-lv1 ${trendClass(s.chip_concentration_score)}">${isNil(s.chip_concentration_score) ? "-" : fmtTrend(s.chip_concentration_score)}</div>
            ${chipLine(s.chip_date_t0 ?? s.chip_latest_date, pickFirst(s.chip_concentration_pct_t0, s.chip_concentration_pct), s.chip_concentration_pct_t1, "%", "", false, "今日")}
            ${chipLine(s.chip_date_t1, s.chip_concentration_pct_t1, s.chip_concentration_pct_t2, "%", "", true, "T-1")}
            ${chipLine(s.chip_date_t2, s.chip_concentration_pct_t2, undefined, "%", "", true, "T-2")}
          </div>
        </td>`;
    }

    function renderMarginPurchaseChangeCell(s) {
      return `

    function renderDataStatus(s) {
      const signal = String(s?.signal ?? "").trim();
      if (!["資料不足", "無資料", "資料異常"].includes(signal)) return "";
      const reason = String(s?.reason ?? "").trim();
      const brief = reason.length > 28 ? `${reason.slice(0, 28)}...` : reason;
      return `<div class="table-lv3 text-red" title="${escapeHtml(reason || signal)}">${escapeHtml(signal)}${brief ? `：${escapeHtml(brief)}` : ""}</div>`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function cleanSignalOutput(value) {
      let text = String(value ?? "");
      const k = (...parts) => parts.join("");
      const replacements = [
        [k("觀察", "再", "賣", "出"), "風險升高"],
        [k("觀察", "再", "買", "進"), "轉強追蹤"],
        [k("等待", "觀察"), "方向尚未明確"],
        [k("買", "進"), "轉強"],
        [k("賣", "出"), "調節"],
        [k("偏", "多"), "轉強"],
        [k("偏", "空"), "轉弱"],
        [k("中", "性"), "震盪"],
        [k("訊號", "尚未", "明確"), "方向尚未明確"]
      ];
      replacements.forEach(([oldText, newText]) => {
        text = text.split(oldText).join(newText);
      });
      return text.trim();
    }

    function renderSignalText(text) {
      const cleaned = cleanSignalOutput(text);
      if (!cleaned) return "";
      const sections = { tech: "", chip: "", other: "" };
      cleaned.split(/\n+/).forEach(line => {
        const item = line.trim();
        if (!item) return;
        if (item.startsWith("技術面：")) sections.tech = item.replace(/^技術面：/, "");
        else if (item.startsWith("技術：")) sections.tech = item.replace(/^技術：/, "");
        else if (item.startsWith("籌碼面：")) sections.chip = item.replace(/^籌碼面：/, "");
        else if (item.startsWith("籌碼：")) sections.chip = item.replace(/^籌碼：/, "");
        else sections.other += (sections.other ? " / " : "") + item;
      });
      const blocks = [];
      if (sections.tech) {
        blocks.push(`<div class="signal-section signal-section-tech"><span class="signal-section-title">技術：</span>${escapeHtml(sections.tech)}</div>`);
      }
      if (sections.chip) {
        blocks.push(`<div class="signal-section signal-section-chip"><span class="signal-section-title">籌碼：</span>${escapeHtml(sections.chip)}</div>`);
      }
      if (!sections.tech && !sections.chip && sections.other) {
        blocks.push(`<div class="signal-section">${escapeHtml(sections.other)}</div>`);
      }
      return `<div class="table-lv2 signal-text">${blocks.join("")}</div>`;
    }

      return `

          <div class="signal-wrap">

      const signal = cleanSignalOutput(s?.signal || "");
      const badgeClass = signal === "買進" || signal === "偏多" ? "up" : signal === "賣出" || signal === "偏空" ? "dn" : "watch";
      return `<span class="sig ${badgeClass}">${escapeHtml(signal || "等待觀察")}</span>`;
    }

    function cbItems(s) {
      return Array.isArray(s?.cb_items) ? s.cb_items : [];
    }

    function renderCbStack(s, renderer) {
      const items = cbItems(s);
      if (!items.length) return `<div class="table-lv2">-</div>`;
      return `<div class="cb-stack">${items.map((item, index) => `<div class="cb-issue-block">${renderer(item, index)}</div>`).join("")}</div>`;
    }

    function cbAmountMillion(value) {
      if (isNil(value) || value === "") return "-";
      return `${fmt(Number(value) / 1000000)}百萬`;
    }

    function cbPressureClass(label) {
      if (label === "高關注") return "cb-pressure-high";
      if (label === "中關注") return "cb-pressure-medium";
      return "cb-pressure-low";
    }

    function cbHistory(item, monthly = false) {
      const values = monthly ? item?.cb_monthly_history : item?.cb_history;
      return Array.isArray(values) ? values : [];
    }

    function cbChangeClass(current, previous, mode = "pressure_up") {
      if (isNil(current) || isNil(previous)) return "";
      const now = Number(current);
      const before = Number(previous);
      if (Number.isNaN(now) || Number.isNaN(before) || now === before) return "";
      if (mode === "neutral") return "";
      const increase = now > before;
      const pressureIncrease = mode === "pressure_down" ? !increase : increase;
      return pressureIncrease ? "up" : "dn";
    }

    function cbChangeArrow(current, previous) {
      if (isNil(current) || isNil(previous)) return "";
      const now = Number(current);
      const before = Number(previous);
      if (Number.isNaN(now) || Number.isNaN(before) || now === before) return "→";
      return now > before ? "↑" : "↓";
    }

    function renderCbMetricHistory(item, key, suffix = "", mode = "pressure_up", monthly = false) {
      const history = cbHistory(item, monthly);
      if (!history.length) return `<div class="table-lv2">-</div>`;
      const prefix = monthly ? "M" : "T";
      return history.slice(0, 3).map((point, index) => {
        const previous = history[index + 1];
        const value = point?.[key];
        const previousValue = previous?.[key];
        const cls = previous ? cbChangeClass(value, previousValue, mode) : "";
        const arrow = previous ? cbChangeArrow(value, previousValue) : "";
        const label = index === 0 ? prefix : `${prefix}-${index}`;
        return `<div class="${index === 0 ? "table-lv1" : "table-lv2"} ${cls}">${label} ${fmt(value, suffix)} ${arrow}</div>`;
      }).join("");
    }

    function renderCbCombinedHistory(item, leftKey, leftLabel, rightKey, rightLabel, suffix, mode) {
      const history = cbHistory(item);
      if (!history.length) return `<div class="table-lv2">-</div>`;
      return history.slice(0, 3).map((point, index) => {
        const previous = history[index + 1];
        const value = point?.[rightKey];
        const previousValue = previous?.[rightKey];
        const cls = previous ? cbChangeClass(value, previousValue, mode) : "";
        const arrow = previous ? cbChangeArrow(value, previousValue) : "";
        const label = index === 0 ? "T" : `T-${index}`;
        return `<div class="${index === 0 ? "table-lv1" : "table-lv2"} ${cls}">${label} ${leftLabel}${fmt(point?.[leftKey])}／${rightLabel}${fmt(value, suffix)} ${arrow}</div>`;
      }).join("");
    }

    function renderCbMarketHistory(item) {
      const history = cbHistory(item);
      if (!history.length) return `<div class="table-lv2">-</div>`;
      return history.slice(0, 3).map((point, index) => {
        const previous = history[index + 1];
        const label = index === 0 ? "T" : `T-${index}`;
        const stockClass = previous ? cbChangeClass(point.cb_underlying_price, previous.cb_underlying_price, "pressure_up") : "";
        const cbClass = previous ? cbChangeClass(point.cb_price, previous.cb_price, "pressure_up") : "";
        const stockArrow = previous ? cbChangeArrow(point.cb_underlying_price, previous.cb_underlying_price) : "";
        const cbArrow = previous ? cbChangeArrow(point.cb_price, previous.cb_price) : "";
        return `<div class="${index === 0 ? "table-lv1" : "table-lv2"}">${label} <span class="${stockClass}">股${fmt(point.cb_underlying_price)} ${stockArrow}</span>／<span class="${cbClass}">CB${fmt(point.cb_price)} ${cbArrow}</span></div>`;
      }).join("");
    }

    function renderCbMonthlyBalance(item) {
      const history = cbHistory(item, true);
      if (!history.length) return `<div class="table-lv2">-</div>`;
      return history.slice(0, 3).map((point, index) => {
        const previous = history[index + 1];
        const currentValue = point?.cb_outstanding_amount;
        const previousValue = previous?.cb_outstanding_amount;
        const cls = previous ? cbChangeClass(currentValue, previousValue, "pressure_up") : "";
        const arrow = previous ? cbChangeArrow(currentValue, previousValue) : "";
        const label = index === 0 ? "M" : `M-${index}`;
        return `<div class="${index === 0 ? "table-lv1" : "table-lv2"} ${cls}">${label} ${cbAmountMillion(currentValue)}／${fmt(point?.cb_remaining_pct, "%")} ${arrow}</div>`;
      }).join("");
    }

    function renderCbPressureHistory(item) {
      const history = cbHistory(item);
      if (!history.length) return `<div class="table-lv2">-</div>`;
      const trendClassName = Number(item.cb_trend_score ?? 0) > 0 ? "up" : Number(item.cb_trend_score ?? 0) < 0 ? "dn" : "";
      const trendArrow = Number(item.cb_trend_score ?? 0) > 0 ? "↑" : Number(item.cb_trend_score ?? 0) < 0 ? "↓" : "→";
      const lines = history.slice(0, 3).map((point, index) => {
        const label = index === 0 ? "T" : `T-${index}`;
        return `<div class="${index === 0 ? "table-lv1" : "table-lv2"} ${cbPressureClass(point.cb_pressure_label)}">${label} ${escapeHtml(point.cb_pressure_label || "-")}</div>`;
      }).join("");
      return `<div class="table-lv2 ${trendClassName}">${trendArrow} ${escapeHtml(item.cb_trend_label || "資料不足")}</div>${lines}`;
    }

    function renderCbMobileGrid(s) {
      return cbItems(s).map(item => `
        <div class="stock-item summary-mobile-item">
          <div class="stock-label">${escapeHtml(item.cb_name || item.cb_id || "CB")}</div>
          <div class="stock-value">
            ${renderCbPressureHistory(item)}
            <div class="table-lv2">CB價 ${fmt(item.cb_price)}／轉換價 ${fmt(item.cb_conversion_price)}</div>
            ${renderCbCombinedHistory(item, "cb_parity", "轉值", "cb_premium_pct", "溢價", "%", "pressure_down")}

          return `<td class="sr-price-cell" title="${escapeHtml(supportResistanceTooltip("resistance"))}">${renderSupportResistanceBlock(s, "resistance")}</td>`;

          return `<td class="sr-price-cell" title="${escapeHtml(supportResistanceTooltip("support"))}">${renderSupportResistanceBlock(s, "support")}</td>`;

    function renderHead() {
      const columns = TAB_CONFIG[currentTab].columns;
      document.getElementById("stockHead").innerHTML = `
        <tr>
          ${columns.map(col => `<th class="${col.cls ?? ""}" data-key="${col.key}"${col.tooltip ? ` data-tooltip="${escapeHtml(col.tooltip)}" tabindex="0"` : ""}>${col.label}</th>`).join("")}
        </tr>`;
      bindSorting();
      updateSortIndicators();
    }

    function renderRow(s, isIndex = false) {
      const columns = TAB_CONFIG[currentTab].columns;
      const rowClass = isIndex ? ' class="index-row"' : '';
      return `<tr${rowClass}>${columns.map(col => applyColumnClass(renderCell(s, col.key), col)).join("")}</tr>`;
    }

    function renderIndexRows() {
      if (!showIndexRows || !indexRows.length || currentTab === "cb") return "";
      return indexRows.map(s => renderRow(s, true)).join("");
    }

    function applyColumnClass(cellHtml, col) {
      const cls = col?.cls;
      if (!cls) return cellHtml;
      return String(cellHtml).replace(/<td\b([^>]*)>/, (match, attrs) => {
        if (/\bclass=/.test(attrs)) {
          return match.replace(/class="([^"]*)"/, `class="$1 ${cls}"`);
        }
        return `<td class="${cls}"${attrs}>`;
      });
    }

          <div class="stock-item"><div class="stock-label">支撐點 / 距離</div>${renderSupportResistanceBlock(s, "support")}</div>

          <div class="stock-item"><div class="stock-label">投信買賣超 T/T-1/T-2</div>${renderInstitutionalBlock(s, "investment_trust_net", "investment_trust_net_score")}</div>
          <div class="stock-item"><div class="stock-label">自營商買賣超 T/T-1/T-2</div>${renderInstitutionalBlock(s, "dealer_net", "dealer_net_score")}</div>

    function renderTable(data) {
      document.getElementById("stockBody").innerHTML =
        renderIndexRows() + data.map(s => renderRow(s, false)).join("");
    }

    function renderMobileCards(data) {
      const indexCards = (showIndexRows && indexRows.length && currentTab !== "cb")
        ? indexRows.map(s => renderMobileCard(s)).join("")
        : "";
      document.getElementById("mobileList").innerHTML = indexCards + data.map(renderMobileCard).join("");
    }

    function getSortValue(s, key) {
      switch (key) {
        case "name":
          return s.name ?? "";
        case "code":
          return s.code ?? "";
        case "sig":
          return Number(s.sig ?? -999999);
        case "price_lh_trend": {
          const score = priceLHTrendScore(s);
          return isNil(score) ? -999999 : Number(score);
        }
        case "yield_value":
          return Number(((s.yield_value ?? 0) * 0.65).toFixed(4));
        case "roe":
          return Number(s.roe_ttm ?? s.roe_last_year ?? -999999);
        case "chip_concentration_5d":
          return Number(s.chip_concentration_avg_5d ?? -999999);
        case "broker_diff_5d":
          return Number(s.broker_diff_avg_5d ?? -999999);
        case "foreign_investor_net":
          return Number(s.foreign_investor_net ?? -999999);
        case "investment_trust_net":
          return Number(s.investment_trust_net ?? -999999);
        case "dealer_net":
          return Number(s.dealer_net ?? -999999);
        case "institutional_total_net":
          return Number(s.institutional_total_net ?? -999999);
        case "cb_issue":
          return String(s.cb_id ?? "");
        case "cb_market":
          return Number(s.cb_price ?? -999999);
        case "cb_conversion":
          return Number(s.cb_conversion_price ?? -999999);
        case "cb_parity_premium":
          return Number(s.cb_premium_pct ?? -999999);
        case "cb_break_even":
          return Number(s.cb_distance_to_break_even_pct ?? -999999);
        case "cb_balance":
          return Number(s.cb_outstanding_amount ?? -999999);
        case "cb_potential_lots":
          return Number(s.cb_potential_lots ?? -999999);
        case "cb_pressure_days":
          return Number(s.cb_pressure_days ?? -999999);
        case "cb_period":
          return Number(s.cb_days_to_due ?? -999999);
        case "per_latest":
        case "pbr_latest":
          return Number(s[key] ?? -999999);
        default: {
          const value = s[key];
          if (isNil(value) || value === "") return -999999;
          const num = Number(value);
          return Number.isNaN(num) ? String(value) : num;
        }
      }
    }

    function sortStocks(key) {
      if (currentSortKey === key) {
        currentSortDirection = currentSortDirection === "asc" ? "desc" : "asc";
      } else {
        currentSortKey = key;
        currentSortDirection = "asc";
      }
      sortCurrentRows();
      renderAll();
    }

    function sortCurrentRows() {
      if (!currentSortKey) return;
      sortedStocks.sort((a, b) => {
        const aVal = getSortValue(a, currentSortKey);
        const bVal = getSortValue(b, currentSortKey);
        const bothNumbers = typeof aVal === "number" && typeof bVal === "number";

        if (bothNumbers) {
          return currentSortDirection === "asc" ? aVal - bVal : bVal - aVal;
        }

        const result = String(aVal).localeCompare(String(bVal), "zh-Hant");
        return currentSortDirection === "asc" ? result : -result;
      });
    }

    function renderAll() {
      const visibleRows = currentTab === "cb"
        ? sortedStocks.filter(stock => Number(stock.cb_count ?? 0) > 0)
        : sortedStocks;
      renderHead();
      renderTable(visibleRows);
      renderMobileCards(visibleRows);
      updateSortIndicators();
      const countEl = document.getElementById("filterCount");
      if (countEl) countEl.innerText = currentTab === "cb"
        ? `顯示 ${visibleRows.length} 檔含CB股票 / ${sortedStocks.length} 筆篩選結果`
        : `顯示 ${visibleRows.length} / ${baseStocks.length} 筆`;
    }

    function updateSortIndicators() {
      document.querySelectorAll("thead th").forEach((th) => {
        const key = th.dataset.key;
        if (!key) return;

        if (!th.dataset.label) {
          th.dataset.label = th.innerHTML.replace(/\s*[▲▼]$/, "");
        }

        th.innerHTML = key === currentSortKey
          ? `${th.dataset.label} ${currentSortDirection === "asc" ? "▲" : "▼"}`
          : th.dataset.label;
      });
    }

    function bindSorting() {
      document.querySelectorAll("thead th[data-key]").forEach((th) => {
        th.addEventListener("click", () => {
          sortStocks(th.dataset.key);
        });
      });
    }

    function bindTabs() {
      document.querySelectorAll(".tab-btn[data-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const nextTab = btn.dataset.tab;
          if (!TAB_CONFIG[nextTab]) return;
          currentTab = nextTab;
          document.querySelectorAll(".tab-btn[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab));
          const note = document.getElementById("tabNote");
          if (note) {
            if (currentTab === "cb") {
              const statusText = (cbMeta.status === "ok" || cbMeta.status === "partial_ok")
                ? `資料日 ${cbMeta.as_of || "-"}`
                : `資料未取得${cbMeta.reason ? `：${cbMeta.reason}` : ""}`;
              note.innerText = `${TAB_CONFIG[currentTab].note}｜${statusText}`;
            } else {
              note.innerText = TAB_CONFIG[currentTab].note;
            }
          }
          renderAll();
        });
      });
    }

    function getNumericValue(s, key) {
      if (key === "chip_concentration_pct_filter") {
        const value = pickFirst(s?.chip_concentration_pct_t0, s?.chip_concentration_pct);
        if (isNil(value) || value === "") return null;
        const num = Number(value);
        return Number.isNaN(num) ? null : num;
      }
      if (key === "main_force_net_filter") {
        const value = pickFirst(s?.main_force_net_t0, s?.main_force_net);
        if (isNil(value) || value === "") return null;
        const num = Number(value);
        return Number.isNaN(num) ? null : num;
      }
      if (key === "institutional_total_net_filter") {
        const value = pickFirst(s?.institutional_total_net_t0, s?.institutional_total_net);
        if (isNil(value) || value === "") return null;
        const num = Number(value);
        return Number.isNaN(num) ? null : num;
      }
      if (key === "broker_diff_filter") {
        const value = pickFirst(s?.broker_diff_t0, s?.broker_diff);
        if (isNil(value) || value === "") return null;
        const num = Number(value);
        return Number.isNaN(num) ? null : num;
      }
      const value = s?.[key];
      if (isNil(value) || value === "") return null;
      const num = Number(value);
      return Number.isNaN(num) ? null : num;
    }

    function selectedCustomCategories() {
      return Array.from(document.querySelectorAll(".custom-category-checkbox:checked"))
        .map(option => normalizeCategoryLabel(option.value))
        .filter(Boolean);
    }

    function updateCategoryToggleText() {
      const button = document.getElementById("customCategoryToggle");
      if (!button) return;
      const count = selectedCustomCategories().length;
      button.textContent = count > 0 ? `已選 ${count} 類` : "全部分類";
    }

    function filterCustomCategoryOptions() {
      const searchInput = document.getElementById("customCategorySearch");
      const keyword = String(searchInput?.value ?? "").trim().toLowerCase();
      const options = Array.from(document.querySelectorAll("#customCategoryOptions .category-option"));

      let visibleCount = 0;
      options.forEach((option) => {
        const category = String(option.dataset.category ?? "");
        const normalized = normalizeCategoryLabel(category).toLowerCase();
        const visible = !keyword || normalized.includes(keyword) || category.toLowerCase().includes(keyword);
        option.hidden = !visible;
        if (visible) visibleCount += 1;
      });

      const emptyEl = document.getElementById("customCategoryEmpty");
      if (emptyEl) emptyEl.hidden = visibleCount > 0;
    }

    function setCustomCategoryPopover(open) {
      const toggle = document.getElementById("customCategoryToggle");
      const popover = document.getElementById("customCategoryPopover");
      if (!toggle || !popover) return;

      popover.hidden = !open;
      toggle.setAttribute("aria-expanded", open ? "true" : "false");

      if (open) {
        filterCustomCategoryOptions();
        const searchInput = document.getElementById("customCategorySearch");
        if (searchInput) searchInput.focus();
      }
    }

    function bindCustomCategoryDropdown() {
      const root = document.getElementById("customCategoryDropdown");
      const toggle = document.getElementById("customCategoryToggle");
      const searchInput = document.getElementById("customCategorySearch");
      const optionsWrap = document.getElementById("customCategoryOptions");
      const selectAllBtn = document.getElementById("customCategorySelectAllBtn");
      const clearBtn = document.getElementById("customCategoryClearBtn");
      if (!root || !toggle || !optionsWrap) return;

      toggle.addEventListener("click", (event) => {
        event.stopPropagation();
        const expanded = toggle.getAttribute("aria-expanded") === "true";
        setCustomCategoryPopover(!expanded);
      });

      if (searchInput) {
        searchInput.addEventListener("input", filterCustomCategoryOptions);
      }

      if (selectAllBtn) {
        selectAllBtn.addEventListener("click", () => {
          document.querySelectorAll("#customCategoryOptions .custom-category-checkbox").forEach((checkbox) => {
            checkbox.checked = true;
          });
          updateCategoryToggleText();
          applyFilters();
        });
      }

      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          document.querySelectorAll("#customCategoryOptions .custom-category-checkbox").forEach((checkbox) => {
            checkbox.checked = false;
          });
          updateCategoryToggleText();
          applyFilters();
        });
      }

      optionsWrap.addEventListener("change", (event) => {
        if (!(event.target instanceof HTMLInputElement)) return;
        if (!event.target.classList.contains("custom-category-checkbox")) return;
        updateCategoryToggleText();
        applyFilters();
      });

      document.addEventListener("click", (event) => {
        if (!(event.target instanceof Node)) return;
        if (!root.contains(event.target)) {
          setCustomCategoryPopover(false);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          setCustomCategoryPopover(false);
        }
      });

      updateCategoryToggleText();
      filterCustomCategoryOptions();
    }

    const CATEGORY_ALIAS_MAP = {
      "燕莉2": "燕俐2",
      "ABF載板": "ABF窄板",
    };

    function normalizeCategoryLabel(value) {
      const text = String(value ?? "").replace(/\s+/g, "").trim();
      if (!text) return "";
      return CATEGORY_ALIAS_MAP[text] || text;
    }

    function stockCustomCategories(s) {
      if (Array.isArray(s?.custom_category_list)) {
        return s.custom_category_list
          .map(item => normalizeCategoryLabel(item))
          .filter(Boolean);
      }
      const text = String(pickFirst(s?.custom_categories, s?.["自選分類"]) ?? "");
      if (!text) return [];
      return text
        .split(/[;,、]/)
        .map(item => normalizeCategoryLabel(item))
        .filter(Boolean);
    }

    function passesFilters(s) {
      const codeInput = document.getElementById("stockCodeFilter");
      const codeKeyword = String(codeInput?.value ?? "").trim();
      if (codeKeyword) {
        const stockCode = String(s?.code ?? s?.stock_id ?? "").trim();
        if (!stockCode.includes(codeKeyword)) return false;
      }

      const selectedCategories = selectedCustomCategories();
      if (selectedCategories.length) {
        const categories = new Set(stockCustomCategories(s));
        if (!selectedCategories.some(category => categories.has(category))) return false;
      }

      const kdDirectionFilter = document.getElementById("kdDirectionFilter");
      if (kdDirectionFilter?.value && kdDirection(s) !== kdDirectionFilter.value) {
        return false;
      }

      const bbDirectionFilter = document.getElementById("bbDirectionFilter");
      if (bbDirectionFilter?.value && bbDirection(s) !== bbDirectionFilter.value) {
        return false;
      }

      const inputs = document.querySelectorAll("[data-filter-key]");
      for (const input of inputs) {
        const raw = String(input.value ?? "").trim();
        if (raw === "") continue;

        const key = input.dataset.filterKey;
        const target = Number(raw);
        const value = getNumericValue(s, key);
        const opEl = document.querySelector(`[data-filter-op="${key}"]`);
        const op = opEl ? opEl.value : ">";

        if (Number.isNaN(target) || value === null) return false;
        if (op === ">" && !(value > target)) return false;
        if (op === "<" && !(value < target)) return false;
      }
      return true;
    }

    function applyFilters() {
      sortedStocks = baseStocks.filter(passesFilters);
      sortCurrentRows();
      renderAll();
    }

    function clearFilters() {
      document.querySelectorAll("[data-filter-key]").forEach(input => input.value = "");
      document.querySelectorAll("[data-filter-op]").forEach(select => select.value = ">");
      const codeInput = document.getElementById("stockCodeFilter");
      if (codeInput) codeInput.value = "";
      document.querySelectorAll("[data-direction-filter]").forEach(select => select.value = "");
      document.querySelectorAll(".custom-category-checkbox").forEach(checkbox => {
        checkbox.checked = false;
      });
      const categorySearch = document.getElementById("customCategorySearch");
      if (categorySearch) categorySearch.value = "";
      filterCustomCategoryOptions();
      updateCategoryToggleText();
      setCustomCategoryPopover(false);
      applyFilters();
    }

    function bindFilters() {
      document.querySelectorAll("[data-filter-key]").forEach(input => {
        input.addEventListener("input", applyFilters);
        input.addEventListener("change", applyFilters);
      });
      document.querySelectorAll("[data-filter-op]").forEach(select => {
        select.addEventListener("change", applyFilters);
      });
      document.querySelectorAll("[data-direction-filter]").forEach(select => {
        select.addEventListener("change", applyFilters);
      });
      const codeInput = document.getElementById("stockCodeFilter");
      if (codeInput) {
        codeInput.addEventListener("input", applyFilters);
        codeInput.addEventListener("change", applyFilters);
      }
      bindCustomCategoryDropdown();
      const applyBtn = document.getElementById("applyFilterBtn");
      const clearBtn = document.getElementById("clearFilterBtn");
      if (applyBtn) applyBtn.addEventListener("click", applyFilters);
      if (clearBtn) clearBtn.addEventListener("click", clearFilters);
    }

    (function bindIndexToggle() {
      const btn = document.getElementById("indexToggleBtn");
      if (!btn) return;
      btn.addEventListener("click", () => {
        showIndexRows = !showIndexRows;
        btn.classList.toggle("active", showIndexRows);
        btn.textContent = showIndexRows ? "📊 顯示指數" : "📊 隱藏指數";
        renderAll();
      });
    })();

    bindTabs();
    bindFilters();
    renderAll();
  </script>



</body>
