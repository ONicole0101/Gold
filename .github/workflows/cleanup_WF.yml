name: Cleanup Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs older than 10 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date -u +%s)
          CUTOFF=$((NOW - 600))

          gh run list \
            --status completed \
            --limit 1000 \
            --json databaseId,createdAt \
            --jq '.[] | "\(.databaseId) \(.createdAt)"' |
          while read -r ID CREATED_AT; do
            CREATED_TS=$(date -d "$CREATED_AT" +%s)

            if [ "$CREATED_TS" -lt "$CUTOFF" ]; then
              echo "Deleting run $ID created at $CREATED_AT"
              gh run delete "$ID"
            fi
          done