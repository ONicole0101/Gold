name: Gen stocks csv

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gencsv.py
        run: python Gencsv.py

      - name: Verify generated files
        run: |
          pwd
          ls -la
          ls -la Allcsv || true
          test -f stocks.csv && echo "stocks.csv exists" || (echo "stocks.csv missing" && exit 1)

      - name: Commit and push stocks.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="${GITHUB_REF_NAME}"
          if [ -z "$TARGET_BRANCH" ]; then
            echo "Cannot determine target branch from GITHUB_REF_NAME"
            exit 1
          fi
          echo "Target branch: $TARGET_BRANCH"

          # Fetch latest target branch so we can build cleanly on top of it.
          # Using reset instead of rebase avoids conflicts in unrelated files
          # (AllStatic.csv, AllStatic_Chips.csv, etc.) that other workflows manage.
          git fetch origin "$TARGET_BRANCH"
          git reset "origin/$TARGET_BRANCH"

          git add stocks.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update stocks.csv"
          git push origin "HEAD:$TARGET_BRANCH"