name: R DataSet Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sync mode
        required: false
        default: incremental
        type: choice
        options:
          - incremental
          - full
          - ask
      datasets:
        description: all or comma-separated dataset names
        required: false
        default: all
      keep_history_files:
        description: Keep historical timestamped files (1 keep, 0 remove old files)
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      one_time_backfill_missing:
        description: One-time backfill missing stock history to 2020-04-01 (1 on, 0 off)
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      generate_csv:
        description: "1) Generate/update existing CSV datasets"
        required: true
        default: true
        type: boolean
      convert_csv_to_parquet:
        description: "2) One-time conversion: existing CSV to Parquet"
        required: true
        default: false
        type: boolean
      generate_parquet:
        description: "3) Generate/update Parquet datasets"
        required: true
        default: true
        type: boolean
  schedule:
    # GitHub Actions cron uses UTC. 07:00 UTC = Taiwan 15:00.
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  sync-dataset:
    runs-on: ubuntu-latest

    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_DEST_FOLDER_ID: ${{ vars.GOOGLE_DEST_FOLDER_ID || secrets.GOOGLE_DEST_FOLDER_ID }}
      GOOGLE_SLEEP_SECONDS: ${{ vars.GOOGLE_SLEEP_SECONDS || secrets.GOOGLE_SLEEP_SECONDS }}
      R_DATASET_OUTPUT_DIR: /tmp/google_dataset
      FINMIND_USAGE_LOG_FILE: /tmp/finmind_token_usage_log.csv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyarrow

      - name: Show selected actions
        run: |
          echo "event=${{ github.event_name }}"
          echo "generate_csv=${{ github.event_name == 'schedule' || inputs.generate_csv }}"
          echo "convert_csv_to_parquet=${{ github.event_name == 'workflow_dispatch' && inputs.convert_csv_to_parquet }}"
          echo "generate_parquet=${{ github.event_name == 'workflow_dispatch' && inputs.generate_parquet }}"

      - name: Check FINMIND_TOKEN and user_info stats
        if: ${{ github.event_name == 'schedule' || inputs.generate_csv || inputs.generate_parquet }}
        run: |
          python - <<'PY'
          import os
          import requests

          user_info_url = "https://api.web.finmindtrade.com/v2/user_info"
          token = str(os.getenv("FINMIND_TOKEN") or "").strip()

          if not token:
            raise SystemExit("FINMIND_TOKEN is not set")

          masked = token[:4] + "..." + token[-4:] if len(token) > 8 else ("*" * len(token))
          headers = {"Authorization": f"Bearer {token}"}

          print(f"FinMind token: token_present=True, source=FINMIND_TOKEN, token={masked}", flush=True)
          try:
            res = requests.get(user_info_url, headers=headers, timeout=300)
            payload = res.json() if res.content else {}
          except Exception as exc:
            raise SystemExit(f"FinMind user_info request failed: {exc}") from exc

          used = payload.get("user_count") if isinstance(payload, dict) else 0
          limit = payload.get("api_request_limit") if isinstance(payload, dict) else 0
          try:
            used = int(used or 0)
            limit = int(limit or 0)
            remain = max(limit - used, 0) if limit else 0
          except Exception:
            remain = 0

          ok = res.status_code == 200 and not (isinstance(payload, dict) and payload.get("error"))
          msg = ""
          if isinstance(payload, dict):
            msg = payload.get("msg") or payload.get("message") or payload.get("status") or ""
          print(f"FinMind usage: {used}/{limit}, remain={remain}", flush=True)
          print(f"FinMind login: {'ok' if ok else 'error'}, status_code={res.status_code}, message={msg}", flush=True)

          if not ok:
            raise SystemExit("FinMind token check failed")
          PY

      - name: Run CSV DataSet sync
        if: ${{ github.event_name == 'schedule' || inputs.generate_csv }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          DATASETS="${{ github.event.inputs.datasets || 'all' }}"
          KEEP_HISTORY_FILES="${{ github.event.inputs.keep_history_files || '1' }}"
          ONE_TIME_BACKFILL_MISSING="${{ github.event.inputs.one_time_backfill_missing || '0' }}"
          export R_DATASET_KEEP_HISTORY_FILES="${KEEP_HISTORY_FILES}"
          export R_DATASET_ONE_TIME_BACKFILL_MISSING="${ONE_TIME_BACKFILL_MISSING}"
          echo "Run mode=${MODE}, datasets=${DATASETS}, keep_history_files=${KEEP_HISTORY_FILES}, one_time_backfill_missing=${ONE_TIME_BACKFILL_MISSING}"
          python R_DataSet.py --mode "${MODE}" --datasets "${DATASETS}"

      - name: One-time convert CSV to Parquet
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.convert_csv_to_parquet }}
        run: |
          echo "Convert existing CSV files to Parquet"
          python Convert_CSV_To_Parquet.py

      - name: Run Parquet DataSet sync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_parquet }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          DATASETS="${{ github.event.inputs.datasets || 'all' }}"
          KEEP_HISTORY_FILES="${{ github.event.inputs.keep_history_files || '1' }}"
          ONE_TIME_BACKFILL_MISSING="${{ github.event.inputs.one_time_backfill_missing || '0' }}"
          export R_DATASET_KEEP_HISTORY_FILES="${KEEP_HISTORY_FILES}"
          export R_DATASET_ONE_TIME_BACKFILL_MISSING="${ONE_TIME_BACKFILL_MISSING}"
          echo "Run Parquet mode=${MODE}, datasets=${DATASETS}, keep_history_files=${KEEP_HISTORY_FILES}, one_time_backfill_missing=${ONE_TIME_BACKFILL_MISSING}"
          python R_DataSet_Parquet.py --mode "${MODE}" --datasets "${DATASETS}"

      - name: Show generated files
        run: |
          pwd
          ls -la "${R_DATASET_OUTPUT_DIR}" || true
          find "${R_DATASET_OUTPUT_DIR}" -maxdepth 2 -type f -print || true
          if [ -f "${FINMIND_USAGE_LOG_FILE}" ]; then
            echo "FinMind usage log: ${FINMIND_USAGE_LOG_FILE}"
            cat "${FINMIND_USAGE_LOG_FILE}"
          fi

