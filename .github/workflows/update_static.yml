name: U_1610 Static CSV

on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: "Source stock list file"
        required: false
        default: "stocks.csv"
      output_file:
        description: "Financial static output file"
        required: false
        default: "AllStatic.csv"
      sleep_sec:
        description: "Sleep seconds between stocks"
        required: false
        default: "0.2"
      refresh_hours:
        description: "Refresh ok/partial_ok rows older than N hours (0 = backfill incomplete rows only)"
        required: false
        default: "24"
  schedule:
    # GitHub Actions cron uses UTC.
    # Full refresh: 22:00 UTC (previous day) = Taiwan 06:00; 04:00 UTC = Taiwan 12:00.
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    # Backfill only (refresh-hours 0): retries incomplete/api_limited/new stocks
    # after FinMind quota resets, without re-downloading completed rows.
    # Taiwan 09:00 / 15:00 / 18:00 / 21:00.
    - cron: "0 1,7,10,13 * * *"

permissions:
  contents: write

concurrency:
  group: update-static-csv
  cancel-in-progress: false

env:
  WORKFLOW_VERSION: "financial-only-20260531-002"
  CSV_FILE: ${{ github.event.inputs.csv_file || vars.CSV_FILE || 'stocks.csv' }}
  STATIC_OUTPUT_FILE: ${{ github.event.inputs.output_file || vars.STATIC_OUTPUT_FILE || 'AllStatic.csv' }}
  STATIC_VALUATION_OUTPUT_FILE: ${{ vars.STATIC_VALUATION_OUTPUT_FILE || 'AllStatic_Valuation.csv' }}
  STATIC_SLEEP_SEC: ${{ github.event.inputs.sleep_sec || vars.STATIC_SLEEP_SEC || '0.2' }}
  STATIC_REFRESH_HOURS: ${{ github.event.inputs.refresh_hours || vars.STATIC_REFRESH_HOURS || '24' }}
  FINMIND_USAGE_LOG_FILE: /tmp/finmind_token_usage_log.csv
  FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

jobs:
  update-static:
    runs-on: ubuntu-latest

    steps:
      - name: Show workflow identity
        run: |
          echo "WORKFLOW_VERSION=${WORKFLOW_VERSION}"
          echo "GITHUB_WORKFLOW=${GITHUB_WORKFLOW}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "CSV_FILE=${CSV_FILE}"
          echo "STATIC_OUTPUT_FILE=${STATIC_OUTPUT_FILE}"
          echo "STATIC_SLEEP_SEC=${STATIC_SLEEP_SEC}"
          echo "STATIC_REFRESH_HOURS=${STATIC_REFRESH_HOURS}"

      - name: Resolve refresh mode
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          REFRESH_HOURS="${STATIC_REFRESH_HOURS}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            case "${SCHEDULE_CRON}" in
              "0 22 * * *"|"0 4 * * *")
                echo "Full refresh schedule: ${SCHEDULE_CRON}"
                ;;
              *)
                # Backfill-only runs never re-download completed rows; they only
                # fill incomplete/api_limited/new-stock rows after quota resets.
                REFRESH_HOURS="0"
                echo "Backfill-only schedule: ${SCHEDULE_CRON}"
                ;;
            esac
          fi
          echo "Effective REFRESH_HOURS=${REFRESH_HOURS}"
          echo "REFRESH_HOURS=${REFRESH_HOURS}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: true

      - name: Pull latest before update
        run: |
          git pull --rebase --autostash

      - name: Inspect workflow file in runner
        run: |
          echo "Current commit:"
          git rev-parse HEAD

          echo "Workflow files:"
          find .github/workflows -maxdepth 1 -type f -print | sort

          echo "update_static.yml content:"
          sed -n '1,240p' .github/workflows/update_static.yml

      - name: Reject legacy static workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/update_static.yml")
          text = path.read_text(encoding="utf-8")

          blocked = [
              "ch" + "ip",
              "Ch" + "ip",
              "CH" + "IP_",
              "Static_" + "Ch" + "ips",
              "AllStatic_" + "Ch" + "ip",
              "AllStatic_" + "Ch" + "ips",
              "generate_static_" + "ch" + "ips",
              "ch" + "ips_analysis",
          ]

          hits = [word for word in blocked if word in text]
          if hits:
              print("ERROR: legacy entries still exist in update_static.yml")
              for word in hits:
                  print(f"found: {word}")
              raise SystemExit(1)

          print("OK: financial workflow only")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests jinja2 FinMind PyYAML loguru tqdm

      - name: Prepare config for financial static build
        run: |
          cat > config.py <<'PY'
          import os

          REPORT_TYPE = os.getenv("REPORT_TYPE", "持股")
          CSV_FILE = os.getenv("CSV_FILE", "stocks.csv")
          REPORT_TITLE = os.getenv("REPORT_TITLE", "(持股)技術分析報告")
          OUTPUT_FILE = os.getenv("OUTPUT_FILE", "持股")
          STATIC_OUTPUT_FILE = os.getenv("STATIC_OUTPUT_FILE", "AllStatic.csv")
          PY

      - name: Generate AllStatic.csv
        run: |
          set -o pipefail
          python generate_static_csv.py \
            --output "${STATIC_OUTPUT_FILE}" \
            --retry-errors \
            --refresh-hours "${REFRESH_HOURS}" \
            --sleep-sec "${STATIC_SLEEP_SEC}"

      - name: Generate AllStatic_Valuation.csv
        run: |
          set -o pipefail
          if [ "${REFRESH_HOURS}" = "0" ]; then
            echo "Backfill-only run: skip full valuation rebuild to save FinMind quota."
            exit 0
          fi
          python generate_static_PER_csv.py \
            --output "${STATIC_VALUATION_OUTPUT_FILE}"

      - name: Show changed files
        run: |
          git status --short

      - name: Commit financial static CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${STATIC_OUTPUT_FILE}"
          git add "${STATIC_VALUATION_OUTPUT_FILE}"

          if git diff --cached --quiet; then
            echo "No financial static changes to commit."
            exit 0
          fi

          git commit -m "Update financial static CSV"

      - name: Clean uncommitted runtime files
        run: |
          git reset -- .
          git restore --worktree .
          git clean -fd
          git status --short

      - name: Push changes
        run: |
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
